<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Face Identify</title>

    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #171b14;
            color: rgb(250, 250, 250);
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            padding: 40px 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 45px;
        }

        .header p {
            margin-top: 14px;
        }

        .card {
            width: 90%;
            max-width: 1000px;
            margin: auto;
            background: #75a8ba;
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 8px 30px rgba(251, 28, 28, 0.338);
        }

        .camera {
            position: relative;
            width: 100%;
            min-height: 500px;
            overflow: hidden;
            border-radius: 20px;
            background: black;
        }

        video,
        #photo {
            width: 100%;
            min-height: 500px;
            object-fit: cover;
            display: block;
        }

        /* Front camera mirror */
        .front-camera {
            transform: scaleX(-1);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .status {
            text-align: center;
            padding: 15px 5px;
            font-size: 16px;
            color: #f90c0c;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .start {
            background: #08ec4d;
            color: white;
        }

        .stop {
            background: #d50000;
            color: white;
        }

        .cameraSwitch {
            background: #1565c0;
            color: white;
        }

        .capture {
            background: #ff00ff;
            color: rgb(255, 251, 251);
        }

        .retake {
            background: #098465;
            color: rgb(249, 248, 248);
        }

        .info {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .box {
            background: #e6ff05;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }

        .box small {
            color: #000000;
        }

        .box strong {
            display: block;
            margin-top: 8px;
            font-size: 30px;
            color: #000000;
        }

        .footer {
            text-align: center;
            color: #fdfdfd;
            font-size: 18px;
            margin: 27px;
        }

        #photo {
            display: none;
        }

        @media (max-width: 600px) {

            .header h1 {
                font-size: 34px;
            }

            .camera {
                min-height: 400px;
            }

            video,
            #photo {
                min-height: 400px;
            }

            .buttons {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Face Identify</h1>
        <p>Age & Gender</p>
    </div>

    <div class="card">

        <div class="camera">

            <video id="video" autoplay muted playsinline></video>

            <img id="photo" alt="Captured Photo">

        </div>

        <div class="status" id="status">
            Loading AI models...
        </div>

        <div class="buttons">

            <button class="start" onclick="startCamera()">
                START CAMERA
            </button>

            <button class="stop" onclick="stopCamera()">
                STOP
            </button>

            <button class="cameraSwitch" onclick="switchCamera()">
                 SWITCH CAMERA
            </button>

            <button class="capture" onclick="capturePhoto()" id="captureBtn" disabled>
                 CAPTURE
            </button>

            <button class="retake" onclick="retakePhoto()" id="retakeBtn" disabled>
                RETAKE
            </button>

        </div>

        <div class="info">

            <div class="box">
                <small>
                    Estimated Age
                </small>

                <strong id="age">--</strong>
            </div>

            <div class="box">
                <small>
                    Gender
                </small>

                <strong id="gender">--</strong>
            </div>

            <div class="box">
                <small>
                    Gender Confidence
                </small>

                <strong id="confidence">--</strong>
            </div>

            <div class="box">
                <small>
                    Faces Found
                </small>

                <strong id="faces">0</strong>
            </div>

        </div>

    </div>

    <div class="footer">

        I'll try my best to give an accurate answer.
        <br>
        If I make any mistakes, please forgive me...

        <br><br>

        <strong>Created by Tahmid Ahsan</strong>

    </div>


    <script>

        const video = document.getElementById("video");
        const photo = document.getElementById("photo");

        const statusText =
            document.getElementById("status");

        const ageText =
            document.getElementById("age");

        const genderText =
            document.getElementById("gender");

        const confidenceText =
            document.getElementById("confidence");

        const facesText =
            document.getElementById("faces");

        const captureBtn =
            document.getElementById("captureBtn");

        const retakeBtn =
            document.getElementById("retakeBtn");


        const MODEL_URL =
            "https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@0.22.2/weights";


        let stream = null;

        let canvas = null;

        let running = false;

        let currentCamera = "user";

        let modelsLoaded = false;


        // =========================
        // LOAD AI MODELS
        // =========================

        async function loadAI() {

            try {

                statusText.innerText =
                    "Loading AI models...";

                await faceapi.nets.tinyFaceDetector
                    .loadFromUri(MODEL_URL);

                await faceapi.nets.ageGenderNet
                    .loadFromUri(MODEL_URL);

                modelsLoaded = true;

                statusText.innerText =
                    "If you Ready, Press to START button.";

            }

            catch (error) {

                console.error(error);

                statusText.innerText =
                    "Model loading failed.";

            }

        }


        loadAI();


        // =========================
        // START CAMERA
        // =========================

        async function startCamera() {

            if (!modelsLoaded) {

                statusText.innerText =
                    "Please wait. AI models are loading...";

                return;
            }


            if (running) {

                stopCamera(false);

            }


            try {

                stream =
                    await navigator.mediaDevices
                        .getUserMedia({

                            video: {

                                facingMode: {
                                    ideal: currentCamera
                                },

                                width: {
                                    ideal: 720
                                },

                                height: {
                                    ideal: 1280
                                }

                            },

                            audio: false

                        });


                video.srcObject = stream;

                running = true;

                photo.style.display = "none";

                video.style.display = "block";

                updateCameraStyle();


                statusText.innerText =
                    "Camera Running. Show your face.";


                captureBtn.disabled = false;

                retakeBtn.disabled = true;


                video.onloadedmetadata = () => {

                    createCanvas();

                    detectFaces();

                };

            }

            catch (error) {

                console.error(error);

                statusText.innerText =
                    "Camera permission denied or camera unavailable.";

            }

        }


        // =========================
        // SWITCH CAMERA
        // =========================

        async function switchCamera() {

            if (currentCamera === "user") {

                currentCamera = "environment";

            }

            else {

                currentCamera = "user";

            }


            if (running) {

                await startCamera();

            }


            updateCameraStyle();

        }


        // =========================
        // CAMERA STYLE
        // =========================

        function updateCameraStyle() {

            if (currentCamera === "user") {

                video.classList.add("front-camera");

            }

            else {

                video.classList.remove("front-camera");

            }

        }


        // =========================
        // STOP CAMERA
        // =========================

        function stopCamera(clearResult = true) {

            running = false;


            if (stream) {

                stream.getTracks().forEach(track => {

                    track.stop();

                });

                stream = null;

            }


            if (canvas) {

                canvas.remove();

                canvas = null;

            }


            video.srcObject = null;


            if (clearResult) {

                ageText.innerText = "--";

                genderText.innerText = "--";

                confidenceText.innerText = "--";

                facesText.innerText = "0";

            }


            captureBtn.disabled = true;

            retakeBtn.disabled = true;


            statusText.innerText =
                "Camera stopped.";

        }


        // =========================
        // CREATE CANVAS
        // =========================

        function createCanvas() {

            if (canvas) {

                canvas.remove();

            }


            canvas =
                faceapi.createCanvasFromMedia(video);


            document
                .querySelector(".camera")
                .appendChild(canvas);


            const size = {

                width: video.videoWidth,

                height: video.videoHeight

            };


            faceapi.matchDimensions(
                canvas,
                size
            );

        }


        // =========================
        // LIVE FACE DETECTION
        // =========================

        async function detectFaces() {

            if (!running)
                return;


            try {

                const detections =
                    await faceapi
                        .detectAllFaces(

                            video,

                            new faceapi
                                .TinyFaceDetectorOptions({

                                    inputSize: 224,

                                    scoreThreshold: 0.5

                                })

                        )
                        .withAgeAndGender();


                const displaySize = {

                    width: video.videoWidth,

                    height: video.videoHeight

                };


                const resized =
                    faceapi.resizeResults(

                        detections,

                        displaySize

                    );


                if (canvas) {

                    canvas
                        .getContext("2d")
                        .clearRect(

                            0,
                            0,
                            canvas.width,
                            canvas.height

                        );

                }


                facesText.innerText =
                    resized.length;


                if (resized.length > 0) {

                    const person =
                        resized[0];


                    let age =
                        Math.round(person.age);


                    age =
                        Math.max(
                            1,
                            Math.min(100, age)
                        );


                    const gender =
                        person.gender;


                    const confidence =
                        Math.round(
                            person.genderProbability * 100
                        );


                    ageText.innerText =
                        age + " years";


                    genderText.innerText =
                        gender;


                    confidenceText.innerText =
                        confidence + "%";


                    resized.forEach(face => {

                        const box =
                            face.detection.box;


                        const drawBox =
                            new faceapi.draw.DrawBox(

                                box,

                                {

                                    label:
                                        `Age: ${Math.round(face.age)}`

                                }

                            );


                        drawBox.draw(canvas);

                    });


                    statusText.innerText =
                        "Face detected! You can capture now.";

                }

                else {

                    ageText.innerText = "--";

                    genderText.innerText = "--";

                    confidenceText.innerText = "--";


                    statusText.innerText =
                        "Looking for face...";

                }

            }

            catch (error) {

                console.log(error);

            }


            if (running) {

                setTimeout(
                    detectFaces,
                    500
                );

            }

        }


        // =========================
        // CAPTURE PHOTO
        // =========================

        async function capturePhoto() {

            if (!running)
                return;


            statusText.innerText =
                "Capturing photo...";


            const captureCanvas =
                document.createElement("canvas");


            captureCanvas.width =
                video.videoWidth;


            captureCanvas.height =
                video.videoHeight;


            const ctx =
                captureCanvas.getContext("2d");


            // Mirror front camera photo
            if (currentCamera === "user") {

                ctx.translate(
                    captureCanvas.width,
                    0
                );

                ctx.scale(-1, 1);

            }


            ctx.drawImage(

                video,

                0,
                0,
                captureCanvas.width,
                captureCanvas.height

            );


            const imageData =
                captureCanvas.toDataURL(
                    "image/jpeg",
                    0.95
                );


            photo.src =
                imageData;


            // Hide live camera
            video.style.display =
                "none";


            if (canvas) {

                canvas.style.display =
                    "none";

            }


            photo.style.display =
                "block";


            running = false;


            if (stream) {

                stream.getTracks().forEach(track => {

                    track.stop();

                });

                stream = null;

            }


            captureBtn.disabled =
                true;


            retakeBtn.disabled =
                false;


            statusText.innerText =
                "Analyzing captured photo...";


            // Detect face from captured image
            photo.onload = async function () {

                try {

                    const detections =
                        await faceapi
                            .detectAllFaces(

                                photo,

                                new faceapi
                                    .TinyFaceDetectorOptions({

                                        inputSize: 224,

                                        scoreThreshold: 0.5

                                    })

                            )
                            .withAgeAndGender();


                    facesText.innerText =
                        detections.length;


                    if (detections.length === 0) {

                        ageText.innerText =
                            "--";

                        genderText.innerText =
                            "--";

                        confidenceText.innerText =
                            "--";


                        statusText.innerText =
                            "No face found. Please RETAKE and try again.";

                        return;

                    }


                    const person =
                        detections[0];


                    let age =
                        Math.round(person.age);


                    age =
                        Math.max(
                            1,
                            Math.min(100, age)
                        );


                    const gender =
                        person.gender;


                    const confidence =
                        Math.round(
                            person.genderProbability * 100
                        );


                    ageText.innerText =
                        age + " years";


                    genderText.innerText =
                        gender;


                    confidenceText.innerText =
                        confidence + "%";


                    statusText.innerText =
                        "Analysis complete!";


                }

                catch (error) {

                    console.error(error);

                    statusText.innerText =
                        "Could not analyze the photo.";

                }

            };

        }


        // =========================
        // RETAKE PHOTO
        // =========================

        function retakePhoto() {

            photo.style.display =
                "none";


            video.style.display =
                "block";


            ageText.innerText =
                "--";

            genderText.innerText =
                "--";

            confidenceText.innerText =
                "--";

            facesText.innerText =
                "0";


            retakeBtn.disabled =
                true;


            updateCameraStyle();


            startCamera();

        }

    </script>

</body>

</html>
```
